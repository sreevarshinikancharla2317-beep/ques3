<!DOCTYPE html>
<html>
<head>
    <title>Event Registration</title>
</head>
<body>

<h2>Event Registration Form</h2>

<form onsubmit="register(event)">
    Name: <input type="text" required><br><br>
    Email: <input type="email" required><br><br>
    Phone Number: <input type="tel"><br><br>
    Event Name: <input type="text" required><br><br>
    <input type="submit" value="Register">
</form>

<script>
function register(e) {
    e.preventDefault();
    document.body.innerHTML = "<h2>Registration Successful!</h2>";
}
</script>

</body>
</html>
